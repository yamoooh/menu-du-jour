<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="512" height="512" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-opacity="0.25" flood-color="#7c2d12"/>
    </filter>
  </defs>
  
  <!-- Fond circulaire doux avec coins arrondis -->
  <rect width="512" height="512" rx="128" fill="url(#bgGradient)"/>
  
  <!-- Cloche de restaurant stylisée -->
  <g filter="url(#shadow)">
    <!-- Bouton poignée de la cloche -->
    <circle cx="256" cy="148" r="22" fill="#ffffff"/>
    
    <!-- Dôme de la cloche -->
    <path d="M128 316 C128 210, 200 178, 256 178 C312 178, 384 210, 384 316 Z" fill="#ffffff"/>
    
    <!-- Base / plateau de la cloche -->
    <rect x="108" y="324" width="296" height="24" rx="12" fill="#ffffff"/>
    
    <!-- Vapeur / arôme subtil au-dessus -->
    <path d="M228 108 C228 92, 240 84, 240 72" stroke="#ffffff" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.8"/>
    <path d="M256 100 C256 86, 268 80, 268 64" stroke="#ffffff" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.9"/>
    <path d="M284 108 C284 92, 296 84, 296 72" stroke="#ffffff" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.8"/>
    
    <!-- Couverts sous le plateau -->
    <g transform="translate(196, 368) scale(0.6)" fill="#ffffff">
      <!-- Fourchette -->
      <path d="M20 10 L20 40 C20 55, 35 65, 50 65 L50 140 L70 140 L70 65 C85 65, 100 55, 100 40 L100 10 L88 10 L88 40 C88 48, 80 52, 70 52 L70 10 L50 10 L50 52 C40 52, 32 48, 32 40 L32 10 Z" fill="#ffffff" opacity="0.9"/>
      <!-- Couteau -->
      <path d="M140 10 C140 10, 180 30, 180 80 C180 100, 160 110, 150 115 L150 140 L130 140 L130 10 Z" fill="#ffffff" opacity="0.9"/>
    </g>
  </g>
</svg>
